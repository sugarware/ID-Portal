<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>バーコードデコーダ比較 1920</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f5f7;color:#222}
main{max-width:760px;margin:auto;padding:16px}
h1{font-size:20px;margin:0 0 8px}.note{font-size:13px;color:#555;margin-bottom:12px}
button{font-size:16px;padding:10px 14px;margin:4px;border:1px solid #888;border-radius:9px;background:white}
#wrap{position:relative;background:#111;margin-top:12px;border-radius:10px;overflow:hidden}
video{display:block;width:100%;height:auto}
.info,.result{background:white;border-radius:9px;padding:10px;margin-top:10px;font-size:14px;word-break:break-all}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ok{font-weight:700}.small{font-size:12px;color:#666}.err{color:#a00}
canvas{display:none}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js"></script>
</head>
<body><main>
<h1>バーコードデコーダ比較（1920×1080 ideal）</h1>
<div class="note">同じ1920フルフレームを、①現行 html5-qrcode（JPEG/File経由）と ②zxing-wasm（ImageData直接）で比較します。</div>
<button id="start">カメラ開始</button><button id="stop">停止</button>
<div id="wrap"><video id="video" playsinline muted></video></div>
<div class="info">実取得解像度: <b id="res">—</b><br>
<span class="small">バーコードを遠方から徐々に近づけ、どちらが先に「認識」になるか比較してください。</span></div>
<div class="row">
 <div class="result">html5-qrcode<br><span id="hr">待機中</span></div>
 <div class="result">zxing-wasm<br><span id="zr">待機中</span></div>
</div>
<div class="info small" id="wasm">zxing-wasm: 読み込み待ち</div>
<canvas id="canvas"></canvas>
<div id="dummy-reader" style="display:none"></div>
</main>
<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const hr=document.getElementById('hr'), zr=document.getElementById('zr'), res=document.getElementById('res'), wasm=document.getElementById('wasm');
let stream=null,running=false,busy=false,lastRun=0,htmlReader=null;
const linearFormats=["Codabar","Code39","Code93","Code128","DataBar","DataBarExpanded","DataBarLimited","DXFilmEdge","EAN8","EAN13","ITF","UPCA","UPCE"];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function stop(){
 running=false;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 video.srcObject=null;res.textContent="—";
}
async function start(){
 await stop();hr.textContent="待機中";zr.textContent="待機中";
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{
   facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}
  }});
  video.srcObject=stream;await video.play();await new Promise(r=>setTimeout(r,250));
  res.textContent=video.videoWidth+" × "+video.videoHeight;
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  if(window.ZXingWASM?.prepareZXingModule){
    try{
      wasm.textContent="zxing-wasm: WASM準備中…";
      await window.ZXingWASM.prepareZXingModule({fireImmediately:true});
      wasm.textContent="zxing-wasm: 準備完了";
    }catch(e){wasm.innerHTML='<span class="err">zxing-wasm準備失敗: '+esc(e.message||e)+'</span>'}
  }else wasm.innerHTML='<span class="err">zxing-wasmスクリプトを読み込めませんでした</span>';
  running=true;loop();
 }catch(e){hr.textContent="起動失敗: "+e.message;zr.textContent="—";}
}
async function compareFrame(){
 ctx.drawImage(video,0,0,canvas.width,canvas.height);
 const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);

 // zxing-wasm: same full-resolution RGBA ImageData, no JPEG.
 try{
  if(window.ZXingWASM?.readBarcodes){
   const rs=await window.ZXingWASM.readBarcodes(imageData,{
     tryHarder:true,formats:linearFormats,maxNumberOfSymbols:1
   });
   if(rs && rs.length && rs[0].text){
    zr.innerHTML='<span class="ok">認識 '+esc(rs[0].format||"")+'</span><br>'+esc(rs[0].text);
   }else zr.textContent="未認識";
  }
 }catch(e){zr.innerHTML='<span class="err">エラー: '+esc(e.message||e)+'</span>'}

 // Current path: full canvas -> JPEG(0.95) -> File -> html5-qrcode scanFile.
 try{
  const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",0.95));
  if(blob){
   if(!htmlReader) htmlReader=new Html5Qrcode("dummy-reader",false);
   const file=new File([blob],"frame.jpg",{type:"image/jpeg"});
   try{
    const text=await htmlReader.scanFile(file,false);
    hr.innerHTML='<span class="ok">認識</span><br>'+esc(text);
   }catch(e){hr.textContent="未認識";}
  }
 }catch(e){hr.innerHTML='<span class="err">エラー: '+esc(e.message||e)+'</span>'}
}
async function loop(t=0){
 if(!running)return;
 if(!busy && video.readyState>=2 && t-lastRun>=500){
  busy=true;lastRun=t;
  try{await compareFrame()}finally{busy=false}
 }
 requestAnimationFrame(loop);
}
document.getElementById('start').onclick=start;
document.getElementById('stop').onclick=stop;
window.addEventListener('pagehide',stop);
</script>
</body></html>
