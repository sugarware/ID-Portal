<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QRカメラ解像度比較 v3</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#111}main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:21px;margin:4px 0 12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}button{min-height:48px;border:1px solid #bbb;border-radius:12px;background:#fff;font-size:16px;font-weight:600;padding:8px}button.active{border:3px solid #111}#videoWrap{position:relative;overflow:hidden;border-radius:14px;background:#111;min-height:240px}video{width:100%;height:auto;display:block}#guide{pointer-events:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82%,520px);aspect-ratio:1/1;border:2px solid rgba(255,255,255,.85);border-radius:12px}.panel{margin-top:12px;padding:12px;background:#fff;border-radius:12px}.label{font-size:13px;color:#666;margin-bottom:4px}.value{font-size:16px;word-break:break-all}#result{min-height:48px}.ok{font-weight:700}.note{font-size:13px;color:#555;line-height:1.5;margin-top:12px}canvas{display:none}
</style>
</head>
<body><main>
<h1>QRカメラ解像度比較 v3</h1>
<div class="controls"><button id="standardBtn">1920×1080 ideal</button><button id="highBtn">2560×1440 ideal</button></div>
<div id="videoWrap"><video id="video" playsinline muted></video><div id="guide"></div></div>
<canvas id="canvas"></canvas>
<div class="panel"><div class="label">指定</div><div id="constraint" class="value">未起動</div></div>
<div class="panel"><div class="label">実際のカメラ映像解像度</div><div id="actual" class="value">—</div></div>
<div class="panel"><div class="label">QR読取結果</div><div id="result" class="value">—</div></div>
<div class="note">カメラ起動はブラウザ標準の getUserMedia() を使用し、QR解析は両モードとも同じ jsQR でフル解像度フレームを解析します。<br>1920×1080 ideal と 2560×1440 ideal を、同じQRコード・距離・照明で切り替えて比較してください。</div>
</main>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const standardBtn=document.getElementById('standardBtn'),highBtn=document.getElementById('highBtn'),constraintEl=document.getElementById('constraint'),actualEl=document.getElementById('actual'),resultEl=document.getElementById('result');
let stream=null,scanTimer=null,lastText='';
async function stopCamera(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;standardBtn.classList.remove('active');highBtn.classList.remove('active')}
function scanFrame(){if(!video.videoWidth||!video.videoHeight||typeof jsQR!=='function')return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});if(code&&code.data!==lastText){lastText=code.data;resultEl.textContent=code.data;resultEl.classList.add('ok')}}
async function startCamera(mode){await stopCamera();actualEl.textContent='取得中…';resultEl.textContent='読取待ち…';resultEl.classList.remove('ok');lastText='';
 const videoConstraints=mode==='high'?{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}}:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}};
 constraintEl.textContent=mode==='high'?'facingMode: ideal environment / width: ideal 2560 / height: ideal 1440':'facingMode: ideal environment / width: ideal 1920 / height: ideal 1080';(mode==='high'?highBtn:standardBtn).classList.add('active');
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:videoConstraints});video.srcObject=stream;await video.play();
  await new Promise(r=>{if(video.videoWidth)r();else video.addEventListener('loadedmetadata',r,{once:true})});
  actualEl.textContent=`${video.videoWidth} × ${video.videoHeight}`;
  scanFrame();scanTimer=setInterval(scanFrame,400);
 }catch(e){actualEl.textContent='起動失敗';resultEl.textContent=String(e&&e.message?e.message:e);}
}
standardBtn.addEventListener('click',()=>startCamera('standard'));highBtn.addEventListener('click',()=>startCamera('high'));window.addEventListener('pagehide',stopCamera);
</script></body></html>
